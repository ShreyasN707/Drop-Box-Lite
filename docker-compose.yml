services:
  app:
    build: .
    container_name: dropbox_lite_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://mongo:27017/dropbox_lite
      - SESSION_SECRET=dropbox_lite_production_secret_key_889341
      - MAX_FILE_SIZE_MB=25
      - DEFAULT_QUOTA_MB=50
      - NODE_ENV=production
    volumes:
      - app_uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_started

  mongo:
    image: mongo:7.0
    container_name: dropbox_lite_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
    driver: local
  app_uploads:
    driver: local
